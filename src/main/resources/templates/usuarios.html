<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        header { background-color: #2c3e50; color: white; padding: 15px; text-align: center; border-radius: 8px; }
        .container { max-width: 900px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #3498db; color: white; }
        form { background: #ecf0f1; padding: 15px; border-radius: 6px; margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        form input, form select { padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; }
        form button { background: #2ecc71; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; grid-column: span 2; }
        form button:hover { background: #27ae60; }
        .btn-eliminar { background: #e74c3c; color: white; padding: 5px 10px; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .btn-eliminar:hover { background: #c0392b; }
        .back-link { display: inline-block; margin-top: 20px; color: #3498db; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <h1>👥 Catálogo y Gestión de Usuarios</h1>
</header>

<div class="container">
    <h2>Lista de Usuarios Registrados</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.usuario}">admin</td>
            <td th:text="${u.rol}">ADMIN</td>
            <td>
                <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn-eliminar" onclick="return confirm('¿Estás seguro de eliminar este usuario?');">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="4" style="text-align: center; color: #7f8c8d;">No hay usuarios registrados.</td>
        </tr>
        </tbody>
    </table>

    <h2>Registrar Nuevo Usuario</h2>
    <form th:action="@{/usuarios/guardar}" th:object="${usuarioObj}" method="post">
        <input type="hidden" th:field="*{id}" />
        <input type="text" th:field="*{usuario}" placeholder="Nombre de usuario" required />
        <input type="password" th:field="*{password}" placeholder="Contraseña" required />
        <select th:field="*{rol}">
            <option value="USUARIO">USUARIO</option>
            <option value="ADMIN">ADMIN</option>
        </select>
        <button type="submit">Guardar Usuario</button>
    </form>

    <a href="/" class="back-link">← Volver al Menú Principal</a>
</div>

</body>
</html>
